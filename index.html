<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Gestão FERTECH</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--cd:#f4f4f7;--tx:#222;--mu:#6b6b7a;--ac:#3f3697;--ac2:#ebe9fb;--bd:#c9c9d3;--rd:#d9534f;--gr:#3fa34d;--or:#d8932a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14141b;--cd:#1f1f29;--tx:#ececf3;--mu:#a2a2b3;--ac:#8f86ff;--ac2:#2a2748;--bd:#3a3a4a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14141b;--cd:#1f1f29;--tx:#ececf3;--mu:#a2a2b3;--ac:#8f86ff;--ac2:#2a2748;--bd:#3a3a4a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top,.hh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.top b{flex:1;text-align:center;color:var(--ac)}.top span{min-width:36px}.hh img{height:38px;border-radius:6px}.hh div{flex:1;display:flex;flex-direction:column}.hh small{color:var(--mu);font-size:11px}
.ib{border:0;background:var(--cd);color:var(--ac);font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.wrap{padding:14px}h3{margin:18px 0 8px;font-size:17px}h4{color:var(--mu);font-size:12px;letter-spacing:.06em;margin:18px 0 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--cd);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:14px;font-size:14px}
.ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:18px}
.cd{background:var(--cd);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cd small,.mu{color:var(--mu)}.s{font-size:13px}
.v{display:flex;justify-content:space-between;align-items:center;color:var(--ac);font-size:14px;margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.dot.g{background:var(--gr)}.dot.o{background:var(--or)}
.rd{color:var(--rd)}.gr{color:var(--gr)}.or{color:var(--or)}
.bar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px;z-index:6}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;flex:1}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn.red{background:transparent;color:var(--rd);border:1px solid var(--rd)}.btn.sm{padding:6px 12px;flex:none;font-size:13px}.w{width:100%;margin-bottom:8px;display:block}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-bottom:10px}
textarea{min-height:64px}label{display:block;font-size:12px;color:var(--mu)}label input,label select,label textarea{margin-top:3px}
.chips{display:flex;gap:6px;margin-bottom:10px}.chips button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{background:var(--cd);border-radius:8px;padding:10px;margin-bottom:8px}.r{display:flex;gap:8px;align-items:end}.r label{flex:1}.r select{flex:3}.r input{margin-bottom:0}.x{border:0;background:none;color:var(--rd);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;background:var(--cd);padding:12px;border-radius:8px;margin:10px 0;font-size:16px}
.alert{border:1px solid var(--or);border-radius:10px;padding:12px;margin-top:14px;cursor:pointer;color:var(--or)}
#sg{width:100%;height:140px;border:1px solid var(--ac);border-radius:8px;background:#fff;touch-action:none}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;overflow:auto;padding:12px}#ov.on{display:block}
.ovb{max-width:820px;margin:0 auto;background:#fff;color:#000;border-radius:10px;padding:16px}.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.bar2 .btn{flex:none}.qt{display:flex;gap:6px;align-items:center;color:#333}.qt input{width:70px;margin:0;background:#fff;color:#000}
.doc{font:12px Arial,sans-serif;color:#000}.doc .hd{display:flex;gap:12px;align-items:flex-start;line-height:1.35}.doc .hd img{height:70px}.doc .hd span{margin-left:auto}
.doc h2{background:#ccc;padding:6px 8px;margin:10px 0;font-size:17px}.doc h3{background:#eee;padding:4px 8px;font-size:14px;margin:12px 0 6px}.doc p{margin:3px 0}.doc .sl{background:#eee;padding:3px 6px}
.doc table{width:100%;border-collapse:collapse}.doc th,.doc td{border-bottom:1px solid #bbb;padding:4px;text-align:left}.doc .tt{text-align:right;font-weight:700;font-size:14px;margin:8px 0}
.sig{display:flex;gap:40px;margin-top:30px;text-align:center}.sig div{flex:1;border-top:1px solid #000;padding-top:3px}.sig img{display:block;height:50px;margin:0 auto -8px}
.lab{width:50mm;height:30mm;display:flex;align-items:center;gap:1.5mm;padding:1.5mm;overflow:hidden;background:#fff;color:#000;font:7.5pt/1.2 Arial,sans-serif;border:1px dashed #777;margin-bottom:3mm}
.lab img{width:15mm;max-height:24mm;object-fit:contain}.lab .t{display:flex;flex-direction:column;gap:.6mm;min-width:0}.lab b{font-size:8.5pt;word-break:break-word}.lab .ct{font-weight:700;margin-top:.5mm}
#stt{position:fixed;top:6px;right:12px;font-size:11px;color:var(--mu);z-index:9;background:var(--bg);padding:2px 6px;border-radius:6px}
#sb{display:none}
@media (min-width:800px){
#sb{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--cd);padding:16px 10px;border-right:1px solid var(--bd);overflow:auto;z-index:7}
#sb .sh{display:flex;align-items:center;gap:8px;padding:4px 6px 14px;font-size:13px}#sb img{height:36px;border-radius:6px}
#sb button{border:0;background:none;color:var(--tx);text-align:left;padding:11px 12px;border-radius:8px;font:inherit;cursor:pointer}
#sb button.on{background:var(--ac);color:#fff}#sb .nb{margin-top:auto;background:var(--ac2);color:var(--ac);font-weight:600;text-align:center}
#app{max-width:none;margin:0 0 0 230px}.wrap{max-width:1100px;padding:20px 28px}.top b{text-align:left}
.bar{left:230px;right:0;max-width:none;justify-content:flex-end}.bar .btn{flex:none;min-width:260px}
#ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}#ls .cd{margin:0}
.wrap>.g2{grid-template-columns:repeat(3,1fr)}#q,.chips{max-width:420px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.frm>div,.frm>h3,.frm>h4,.frm>.w,.frm>textarea{grid-column:1/-1}.frm>.sm{justify-self:start;align-self:start}
.v-od{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v-od>.cd{grid-column:1/-1}.v-od>.w{margin:0}
.v-acc{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.v-acc>.chips,.v-acc>h3,.v-acc>div,.v-acc>button,.v-acc>canvas,.v-acc>label:has(textarea){grid-column:1/-1}.v-acc #sg{max-width:600px}
.v-agenda>input,.v-agenda>select{max-width:420px}
}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block!important}body{background:#fff}.lab{border:0;margin:0;break-after:page}.lab:last-child{break-after:auto}}
</style><style id="pg"></style></head><body>
<div id="stt"></div><aside id="sb"></aside><div id="app"></div><div id="pa"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dt=v=>v?v.split('-').reverse().join('/'):'',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
let db;try{db=JSON.parse(localStorage.getItem('fx'))}catch(e){}db=db||{};
db.cfg=Object.assign({nome:'FERTECH Soluções Em Tecnologias.ltda',razao:'F&F SOLUCOES EM TECNOLOGIA LTDA',cnpj:'57.168.611/0001-60',tel:'+55 (42) 98835-3213',end:'Rua Timbiras, 2171 - Vila Carli, Guarapuava-PR, CEP 85040-270',wa:'5542988353213',email:'fertech.gpva@gmail.com',insta:'@fertech.gpva',slogan:'TECNOLOGIA SEM COMPLICAÇÃO',pix:'57168611000160',meios:'Dinheiro, cartão de crédito, cartão de débito, pix ou link de pagamento.',logo:'',sign:'',nome1:'Fernando',nome2:'Ferreira',cpf:'',next:52},db.cfg);
['clients','parts','svcs','orders','agenda'].forEach(k=>db[k]=db[k]||[]);
const LK=['clients','parts','svcs','orders','agenda'],CH=80;let DB=null,last={},TM=0;
const stt=t=>{const e=$('#stt');if(e)e.textContent=t};
const pts=()=>{const {logo,sign,...rest}=db.cfg,o={cfg:{v:rest},logo:{v:logo||''},sign:{v:sign||''},meta:{n:{}}};for(const k of LK){const n=Math.max(1,Math.ceil(db[k].length/CH));o.meta.n[k]=n;for(let i=0;i<n;i++)o[k+'_'+i]={v:db[k].slice(i*CH,(i+1)*CH)}}return o};
async function flush(){if(!DB)return;stt('Salvando...');try{await Promise.all(Object.entries(pts()).map(async([k,v])=>{const s=JSON.stringify(v);if(last[k]!==s){await DB.doc('fx/'+k).set(v);last[k]=s}}));stt('✓ Salvo no sistema')}catch(e){stt('⚠ Erro ao salvar: '+(e.code||e.message||''))}}
const save=()=>{try{localStorage.setItem('fx',JSON.stringify(db))}catch(e){}clearTimeout(TM);if(DB){stt('Salvando...');TM=setTimeout(flush,700)}};
const cl=id=>db.clients.find(c=>c.id==id)||{},cn=id=>cl(id).nome||'Sem cliente';
const tot=o=>o.items.reduce((s,i)=>s+i.qtd*i.preco,0)-(+o.dsc||0)+(+o.entrega||0)+(+o.outras||0);
let st=[],V='home',A=[],cur=null,draft=null,tab='Todos',at='b',L={},OT='';
const go=(v,...a)=>{st.push([V,A]);V=v;A=a;render()},back=()=>{const p=st.pop()||['home',[]];V=p[0];A=p[1];render()};
const scr=(t,b,bar='')=>{$('#app').innerHTML=`<div class="top"><button class="ib" onclick="back()">‹</button><b>${t}</b><span></span></div><div class="wrap v-${V}">${b}</div>${bar?`<div class="bar">${bar}</div>`:''}`};
function render(){({home,orders:ordL,od:()=>od(A[0]),of:()=>ofm(),lst:()=>lst(A[0]),frm:()=>frm(A[0],A[1]),agenda:agd,fin,acc})[V]();sb();scrollTo(0,0)}
const NV=[['home','','Início','🏠'],['orders','','Pedidos','📋'],['agenda','','Agenda','🗓️'],['fin','','Financeiro','💲'],['lst','clients','Clientes','👤'],['lst','parts','Peças & estoque','📦'],['lst','svcs','Serviços','🧰'],['acc','','Conta','⚙️']];
const nv=(v,a)=>{st=[];V=v;A=a?[a]:[];render()};
function sb(){const c=['od','of'].includes(V)?'orders':(V=='frm'||V=='lst')?'lst'+A[0]:V,g=db.cfg;$('#sb').innerHTML=`<div class="sh">${g.logo?`<img src="${g.logo}">`:''}<b>${esc(g.nome)}</b></div>`+NV.map(n=>`<button class="${n[0]+n[1]==c?'on':''}" onclick="nv('${n[0]}','${n[1]}')">${n[3]} ${n[2]}</button>`).join('')+`<button class="nb" onclick="ofOpen()">＋ Novo pedido</button>`}
const T=[['orders','Pedidos','📋','#d9d6f7'],['agenda','Agenda','🗓️','#c9f0f2'],['fin','Financeiro','💲','#d1f0d4'],['lst','Clientes','👤','#f6dfb5','clients'],['lst','Peças & estoque','📦','#d3e3f8','parts'],['lst','Serviços','🧰','#d3e3f8','svcs']];
function home(){const g=db.cfg,low=db.parts.filter(p=>p.qtd!==''&&p.qtd!=null&&+p.qtd<=0).length,pend=db.orders.filter(o=>o.status!='Concluído').length;
$('#app').innerHTML=`<div class="hh">${g.logo?`<img src="${g.logo}">`:''}<div><b>${esc(g.nome)}</b><small>${esc(g.slogan)}</small></div><button class="ib" onclick="go('acc')">⚙️</button></div><div class="wrap"><div class="g2">${T.map(t=>`<div class="tile" onclick="go('${t[0]}'${t[4]?`,'${t[4]}'`:''})"><span class="ic" style="background:${t[3]}">${t[2]}</span>${t[1]}</div>`).join('')}</div>
${low?`<div class="alert" onclick="go('lst','parts')"><b>${low} peça(s) sem estoque</b><br><small>Toque para ver o catálogo.</small></div>`:''}${pend?`<div class="alert" style="color:var(--ac);border-color:var(--ac)" onclick="go('orders')"><b>${pend} pedido(s) pendente(s)</b></div>`:''}</div><div class="bar"><button class="btn" onclick="ofOpen()">Criar novo pedido</button></div>`}
function ordL(){scr('Pedidos',`<div class="chips">${['Todos','Pendente','Concluído'].map(x=>`<button class="${tab==x?'on':''}" onclick="tab='${x}';ordL()">${x}</button>`).join('')}</div><input id="q" placeholder="Buscar" oninput="ol()"><div id="ls"></div>`,`<button class="btn" onclick="ofOpen()">＋ novo pedido</button>`);ol()}
function ol(){const q=($('#q').value||'').toLowerCase();$('#ls').innerHTML=db.orders.filter(o=>(tab=='Todos'||o.status==tab)&&(!q||(cn(o.cli)+o.num+o.equip).toLowerCase().includes(q))).slice().reverse().map(o=>`<div class="cd" onclick="go('od','${o.id}')"><small><i class="dot ${o.status=='Concluído'?'g':'o'}"></i>${o.status}</small><b>${esc(cn(o.cli))}</b><small>Pedido n. ${o.num}<br>Criado em ${dt(o.data)}</small><div class="v"><span>Valor:</span><span>${brl(tot(o))}</span></div></div>`).join('')||'<p class="mu">Nenhum pedido.</p>'}
function od(id){const o=db.orders.find(x=>x.id==id);scr('Pedido '+o.num,`<div class="cd" style="cursor:default"><small><i class="dot ${o.status=='Concluído'?'g':'o'}"></i>${o.status}</small><b>${esc(cn(o.cli))}</b><small>${esc([o.aparelho,o.marca,o.modelo,o.equip].filter(Boolean).join(' · '))}<br>Defeito: ${esc(o.defeito)}</small><div class="v"><span>Total</span><b>${brl(tot(o))}</b></div></div>
<button class="btn sec w" onclick="showDoc('${id}','Orçamento')">📄 Imprimir orçamento / PDF</button><button class="btn sec w" onclick="showDoc('${id}','Ordem de serviço')">📄 Imprimir ordem de serviço / PDF</button><button class="btn sec w" onclick="lab('${esc(cn(o.cli))}','${esc(cl(o.cli).tel)}','${o.num}')">🏷️ Imprimir etiqueta 5×3 cm</button>
${o.status!='Concluído'?`<button class="btn sec w" onclick="concl('${id}');od('${id}')">✅ Marcar como concluído</button>`:''}<button class="btn sec w" onclick="ofOpen('${id}')">✏️ Editar pedido</button><button class="btn red w" onclick="if(confirm('Excluir este pedido?')){db.orders=db.orders.filter(x=>x.id!='${id}');db.agenda=db.agenda.filter(a=>a.oid!='${id}');save();back()}">Excluir pedido</button>`)}
const baixa=o=>{if(o.baixa)return;o.items.forEach(i=>{if(i.t=='p'){const p=db.parts.find(x=>x.id==i.id);if(p&&p.qtd!=='')p.qtd=Math.max(0,+p.qtd-i.qtd)}});o.baixa=1};
function concl(id){const o=db.orders.find(x=>x.id==id);o.status='Concluído';baixa(o);save();if(V=='fin')fin()}
function ofOpen(id){draft=id?JSON.parse(JSON.stringify(db.orders.find(o=>o.id==id))):{id:uid(),num:String(db.cfg.next).padStart(3,'0')+'-'+new Date().getFullYear(),data:today(),status:'Pendente',items:[],meios:db.cfg.meios};go('of')}
function ofm(){const y=scrollY,o=draft,F=(k,l,t='text')=>`<input placeholder="${l}" type="${t}" value="${esc(o[k])}" oninput="draft.${k}=this.value">`,TA=(k,l)=>`<textarea placeholder="${l}" oninput="draft.${k}=this.value">${esc(o[k])}</textarea>`,N=(k,l)=>`<label>${l}<input type="number" step="0.01" value="${o[k]||''}" oninput="draft.${k}=+this.value;tt()"></label>`;
const items=ty=>o.items.map((it,i)=>it.t==ty?`<div class="it"><b>${esc(it.nome)}</b><div class="r"><label>Qtd<input type="number" min="0" step="any" value="${it.qtd}" oninput="draft.items[${i}].qtd=+this.value;tt()"></label><label>Preço (R$)<input type="number" step="0.01" value="${it.preco}" oninput="draft.items[${i}].preco=+this.value;tt()"></label><button class="x" onclick="draft.items.splice(${i},1);ofm()">✕</button></div></div>`:'').join('')+`<div class="r"><select id="add${ty}"><option value="">Adicionar ${ty=='s'?'serviço':'peça'}...</option>${(ty=='s'?db.svcs:db.parts).map(x=>`<option value="${x.id}">${esc(x.nome)} - ${brl(x.preco)}</option>`).join('')}</select><button class="btn sm" style="margin-bottom:0" onclick="addIt('${ty}')">＋</button></div>`;
scr('Pedido',`<div class="frm"><div style="margin-bottom:12px"><b style="font-size:17px">Pedido n. ${o.num}</b><br><small class="mu">${dt(o.data)}</small></div>
<select onchange="draft.cli=this.value"><option value="">Selecione um cliente</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id==o.cli?'selected':''}>${esc(c.nome)}</option>`).join('')}</select><button class="btn sec sm" style="margin-bottom:10px" onclick="go('frm','clients','')">＋ cadastrar cliente</button>
${F('ref','Referência')}<h3>Informações básicas</h3>${F('marca','Marca')}${F('modelo','Modelo')}${F('aparelho','Aparelho')}${F('equip','Equipamento')}${F('serie','Número de série')}${TA('defeito','Defeito')}
<h3>Compromissos</h3><div class="r"><label>Visita técnica<input type="date" value="${o.vd||''}" oninput="draft.vd=this.value"></label><label>Hora<input type="time" value="${o.vh||''}" oninput="draft.vh=this.value"></label></div><div class="r" style="margin-top:8px"><label>Compromisso<input type="date" value="${o.cd||''}" oninput="draft.cd=this.value"></label><label>Hora<input type="time" value="${o.ch||''}" oninput="draft.ch=this.value"></label></div>
<h3>Pedido</h3><h4>SERVIÇOS</h4>${items('s')}<h4>PEÇAS</h4>${items('p')}<div class="g2" style="margin-top:10px">${N('dsc','Desconto (R$)')}${N('entrega','Taxa de entrega')}${N('outras','Outras taxas')}</div><div class="tot"><span>Total</span><b id="tt">${brl(tot(o))}</b></div>
<h3>Detalhes</h3>${TA('cond','Condições de pagamento')}${TA('meios','Meios de pagamento')}${TA('garantia','Garantia')}${TA('clausulas','Cláusulas contratuais')}${TA('info','Informações adicionais')}${TA('notas','Anotações (internas)')}
<label>Situação<select onchange="draft.status=this.value"><option ${o.status=='Pendente'?'selected':''}>Pendente</option><option ${o.status=='Concluído'?'selected':''}>Concluído</option></select></label></div>`,`<button class="btn" onclick="svo()">salvar pedido</button>`);scrollTo(0,y)}
const tt=()=>{$('#tt').textContent=brl(tot(draft))};
function addIt(ty){const id=$('#add'+ty).value;if(!id)return;const x=(ty=='s'?db.svcs:db.parts).find(z=>z.id==id);draft.items.push({t:ty,id,nome:x.nome,preco:+x.preco||0,qtd:1});ofm()}
function svo(){const o=draft;if(!o.cli){alert('Selecione um cliente.');return}const i=db.orders.findIndex(x=>x.id==o.id);if(i<0){db.orders.push(o);db.cfg.next++}else db.orders[i]=o;
if(o.status=='Concluído')baixa(o);db.agenda=db.agenda.filter(a=>a.oid!=o.id);[['vd','vh','Visita técnica'],['cd','ch','Compromisso']].forEach(([d,h,t])=>{if(o[d])db.agenda.push({id:uid(),oid:o.id,data:o[d],hora:o[h]||'',desc:t+' - pedido '+o.num,cli:o.cli})});save();draft=null;back()}
const ENT={clients:{t:'Clientes',n:'novo cliente',f:[['nome','Nome'],['tel','Telefone','tel'],['doc','CPF/CNPJ'],['email','E-mail','email'],['end','Endereço']],c:r=>`<b>${esc(r.nome)}</b><small>${esc(r.tel)}</small>`},
parts:{t:'Catálogo de peças',n:'cadastrar peça',f:[['nome','Nome da peça'],['cat','Categoria'],['qtd','Quantidade em estoque (vazio = sem controle)','number'],['preco','Preço por unidade (R$)','number']],c:r=>`<b>${esc(r.nome)}</b><small>${esc(r.cat)}</small>${r.qtd!==''&&r.qtd!=null?`<div class="v"><span class="mu">Quantidade em estoque:</span><span class="${+r.qtd<=0?'rd':''}">${+r.qtd<=0?'Sem estoque!':r.qtd+' un.'}</span></div>`:''}<div class="v"><span>Preço por unidade:</span><span>${brl(r.preco)}</span></div>`},
svcs:{t:'Catálogo de serviços',n:'cadastrar serviço',f:[['nome','Nome do serviço'],['desc','Descrição'],['preco','Preço (R$)','number'],['por','Cobrança','sel',['unidade','hora']]],c:r=>`<b>${esc(r.nome)}</b><small>${esc(r.desc)}</small><div class="v"><span>Preço por ${r.por||'unidade'}:</span><span>${brl(r.preco)}</span></div>`}};
function lst(k){const e=ENT[k];scr(e.t,`<input id="q" placeholder="Buscar" oninput="ll('${k}')"><div id="ls"></div>`,`<button class="btn" onclick="go('frm','${k}','')">＋ ${e.n}</button>`);ll(k)}
function ll(k){const q=($('#q').value||'').toLowerCase(),e=ENT[k];$('#ls').innerHTML=db[k].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(r=>`<div class="cd" onclick="go('frm','${k}','${r.id}')">${e.c(r)}</div>`).join('')||'<p class="mu">Nada cadastrado.</p>'}
function frm(k,id){const e=ENT[k];cur=id?{...db[k].find(x=>x.id==id)}:{id:uid(),por:'unidade',qtd:''};
scr(id?'Editar':e.n,'<div class="frm">'+e.f.map(([f,l,t,o])=>t=='sel'?`<label>${l}<select onchange="cur.${f}=this.value">${o.map(x=>`<option ${cur[f]==x?'selected':''}>${x}</option>`).join('')}</select></label>`:`<label>${l}<input type="${t||'text'}" step="any" value="${esc(cur[f])}" oninput="cur.${f}=this.value"></label>`).join('')+(id&&k=='clients'?`<button class="btn sec w" onclick="lab(cur.nome,cur.tel||'','')">🏷️ Imprimir etiqueta 5×3 cm</button>`:'')+(id?`<button class="btn red w" onclick="if(confirm('Excluir?')){db['${k}']=db['${k}'].filter(x=>x.id!=cur.id);save();back()}">Excluir</button>`:'')+'</div>',`<button class="btn" onclick="sfrm('${k}')">salvar</button>`)}
function sfrm(k){if(!cur.nome){alert('Preencha o nome.');return}if('preco' in cur)cur.preco=+cur.preco||0;if('qtd' in cur)cur.qtd=cur.qtd===''?'':+cur.qtd;const i=db[k].findIndex(x=>x.id==cur.id);i<0?db[k].push(cur):db[k][i]=cur;save();back()}
function agd(){const l=db.agenda.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));scr('Agenda',`<h4>NOVO COMPROMISSO</h4><input id="ad" type="date" value="${today()}"><input id="ah" type="time"><input id="at" placeholder="Descrição"><select id="ac"><option value="">Cliente (opcional)</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select><button class="btn w" onclick="addAg()">Adicionar</button><h4>COMPROMISSOS</h4>${l.map(a=>`<div class="cd" style="cursor:default"><b>${dt(a.data)} ${a.hora||''}</b><span>${esc(a.desc)}</span><small>${esc(a.cli?cn(a.cli):'')}</small><button class="x" style="align-self:flex-end" onclick="db.agenda=db.agenda.filter(z=>z.id!='${a.id}');save();agd()">✕ remover</button></div>`).join('')||'<p class="mu">Sem compromissos.</p>'}`)}
function addAg(){if(!$('#ad').value||!$('#at').value){alert('Informe data e descrição.');return}db.agenda.push({id:uid(),data:$('#ad').value,hora:$('#ah').value,desc:$('#at').value,cli:$('#ac').value});save();agd()}
function fin(){const P=db.orders.filter(o=>o.status!='Concluído'),C=db.orders.filter(o=>o.status=='Concluído'),s=a=>a.reduce((x,o)=>x+tot(o),0);scr('Financeiro',`<div class="g2"><div class="cd" style="cursor:default"><small>A receber</small><b class="or">${brl(s(P))}</b></div><div class="cd" style="cursor:default"><small>Recebido</small><b class="gr">${brl(s(C))}</b></div></div><h3>Pedidos pendentes</h3>${P.map(o=>`<div class="cd" style="cursor:default"><b>${esc(cn(o.cli))}</b><small>Pedido n. ${o.num}</small><div class="v"><span>${brl(tot(o))}</span><button class="btn sm" onclick="concl('${o.id}')">Marcar recebido</button></div></div>`).join('')||'<p class="mu">Nada pendente.</p>'}`)}
function acc(){const g=db.cfg,I=(k,l,t='text')=>`<label>${l}<input type="${t}" value="${esc(g[k])}" oninput="db.cfg.${k}=this.value;save()"></label>`;
scr('Conta',`<div class="chips"><button class="${at=='p'?'on':''}" onclick="at='p';acc()">Meu perfil</button><button class="${at=='b'?'on':''}" onclick="at='b';acc()">Perfil do meu negócio</button></div>`+(at=='b'?`<div style="text-align:center">${g.logo?`<img src="${g.logo}" style="max-width:220px;max-height:120px;border-radius:8px"><br>`:''}<label style="color:var(--ac);cursor:pointer;margin:8px 0 14px">editar logo do negócio<input type="file" accept="image/*" style="display:none" onchange="setLogo(this.files[0])"></label></div>${I('nome','Nome da empresa')}${I('razao','Nome corporativo')}${I('cnpj','CNPJ')}${I('tel','Telefone')}${I('end','Endereço')}${I('wa','WhatsApp (somente números)')}${I('email','E-mail','email')}${I('insta','Instagram')}${I('slogan','Slogan')}${I('pix','Chave PIX')}<label>Meios de pagamento padrão<textarea oninput="db.cfg.meios=this.value;save()">${esc(g.meios)}</textarea></label>
<h3>Backup</h3><button class="btn sec w" onclick="bk()">Baixar backup dos dados</button><label>Restaurar backup<input type="file" accept=".json" onchange="rs(this.files[0])"></label>`:`${I('nome1','Primeiro nome')}${I('nome2','Sobrenome')}${I('cpf','CPF')}<h3>Assinatura</h3><canvas id="sg" width="600" height="280"></canvas><button class="btn sec w" style="margin-top:8px" onclick="db.cfg.sign='';save();acc()">Apagar assinatura</button>`));if(at=='p')sgInit()}
function sgInit(){const c=$('#sg'),x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';let d=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>{d=0;db.cfg.sign=c.toDataURL();save()};
if(db.cfg.sign){const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=db.cfg.sign}}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.cfg.logo=c.toDataURL('image/png');save();acc()};i.src=r.result};r.readAsDataURL(f)}
async function bk(){try{const d=await claude.use('downloads');if(d){await d.save({filename:'backup-fertech-'+today()+'.json',data:JSON.stringify(db)});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='backup-fertech-'+today()+'.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(db,JSON.parse(r.result));save();st=[];V='home';render()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function dochtml(o,tipo){const g=db.cfg,c=cl(o.cli),tb=(t,ty)=>{const r=o.items.filter(i=>i.t==ty);return r.length?`<h3>${t}</h3><table><tr><th>Descrição</th><th>Preço unit.</th><th>Qtd.</th><th>Preço</th></tr>${r.map(i=>`<tr><td>${esc(i.nome)}</td><td>${brl(i.preco)}</td><td>${i.qtd}</td><td>${brl(i.preco*i.qtd)}</td></tr>`).join('')}</table>`:''},P=(l,v)=>v?`<p><b>${l}:</b> ${esc(v)}</p>`:'';
return `<div class="doc"><div class="hd">${g.logo?`<img src="${g.logo}">`:''}<div><b style="font-size:15px">${esc(g.nome)}</b><br>${esc(g.razao)}<br>CNPJ: ${esc(g.cnpj)}<br>${esc(g.end)}<br>${esc(g.tel)} · ${esc(g.email)} · ${esc(g.insta)}</div><span>${dt(today())}</span></div><p class="sl">${esc(g.slogan)}</p><h2>${tipo} ${o.num}</h2>
<p><b>Cliente: ${esc(c.nome)}</b></p>${P('CPF/CNPJ',c.doc)}${P('Telefone',c.tel)}${P('E-mail',c.email)}${P('Endereço',c.end)}
<h3>Informações básicas</h3>${P('Marca',o.marca)}${P('Modelo',o.modelo)}${P('Aparelho',o.aparelho)}${P('Equipamento',o.equip)}${P('Nº de série',o.serie)}${P('Defeito',o.defeito)}
${tb('Serviços','s')}${tb('Peças','p')}${o.dsc?P('Desconto','-'+brl(o.dsc)):''}${o.entrega?P('Taxa de entrega',brl(o.entrega)):''}${o.outras?P('Outras taxas',brl(o.outras)):''}<div class="tt">Total: ${brl(tot(o))}</div>
<h3>Pagamento</h3>${P('Condições',o.cond)}${P('Meios de pagamento',o.meios)}${P('PIX',g.pix)}${o.garantia?`<h3>Garantia</h3><p>${esc(o.garantia)}</p>`:''}${o.clausulas?`<h3>Cláusulas contratuais</h3><p>${esc(o.clausulas)}</p>`:''}${o.info?`<h3>Informações adicionais</h3><p>${esc(o.info)}</p>`:''}
<p style="text-align:center;font-weight:700;margin-top:14px">Guarapuava, ${dt(today())}</p><div class="sig"><div>${g.sign?`<img src="${g.sign}">`:''}${esc(g.nome)}<br>${esc(g.nome1)} ${esc(g.nome2)}</div><div>${esc(c.nome)}<br>${esc(c.doc)}</div></div></div>`}
function ov(html,pg,ttl,extra=''){OT=ttl;$('#ov').innerHTML=`<div class="ovb"><div class="bar2"><button class="btn" onclick="prt('${pg}')">Imprimir / Salvar PDF</button><button class="btn sec" onclick="$('#ov').className=''">Fechar</button>${extra}</div><p class="s" style="color:#555;margin:0 0 10px">Na janela de impressão, escolha “Salvar como PDF” como destino para gerar o arquivo.</p><div id="pc">${html}</div></div>`;$('#ov').className='on'}

async function boot(){$('#app').innerHTML='<div class="wrap"><p class="mu">Carregando dados...</p></div>';
try{DB=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),12000))])}catch(e){DB=null}
if(DB){try{const m=await DB.doc('fx/meta').get();
if(m.exists){const n=m.data().n||{},jobs=['cfg','logo','sign',...LK.flatMap(k=>Array.from({length:n[k]||1},(_,i)=>k+'_'+i))],sn=await Promise.all(jobs.map(j=>DB.doc('fx/'+j).get())),g={};jobs.forEach((j,i)=>{if(sn[i].exists)g[j]=sn[i].data().v});
db.cfg=Object.assign(db.cfg,g.cfg||{},{logo:g.logo||'',sign:g.sign||''});LK.forEach(k=>{db[k]=[];for(let i=0;i<(n[k]||1);i++)db[k]=db[k].concat(g[k+'_'+i]||[])});Object.entries(pts()).forEach(([k,v])=>last[k]=JSON.stringify(v));try{localStorage.setItem('fx',JSON.stringify(db))}catch(e){}stt('✓ Dados carregados do sistema')}
else{await flush()}}catch(e){stt('⚠ Banco indisponível: '+(e.code||e.message||''));DB=null}}else stt('Dados salvos neste computador');
render()}
boot();
